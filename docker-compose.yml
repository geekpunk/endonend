# Brings up the entire MVP with a single `docker compose up`, per
# KB/0010-mvp-scope.md: postgres, the backend (crawler + GraphQL catalog
# API), and the web app, matching KB/0006-container-infrastructure.md's
# compose design. Meilisearch is omitted; search isn't in MVP scope.
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-endonend}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-endonend}
      POSTGRES_DB: ${POSTGRES_DB:-endonend}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-endonend}"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: .
      dockerfile: api/Dockerfile
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-endonend}:${POSTGRES_PASSWORD:-endonend}@postgres:5432/${POSTGRES_DB:-endonend}?sslmode=disable
      ADMIN_TOKEN: ${ADMIN_TOKEN:?set ADMIN_TOKEN in .env, see .env.example}
      PORT: "8080"
      CRAWL_CHECK_INTERVAL: ${CRAWL_CHECK_INTERVAL:-60s}
    ports:
      - "${BACKEND_PORT:-8080}:8080"
    depends_on:
      postgres:
        condition: service_healthy

  web:
    build:
      context: .
      dockerfile: web/Dockerfile
      args:
        VITE_API_URL: ${PUBLIC_API_URL:-http://localhost:8080}
    ports:
      - "${WEB_PORT:-3000}:80"
    depends_on:
      - backend

volumes:
  postgres-data:
