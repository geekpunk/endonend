name: Go

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        # Add a new entry here whenever another Go module is added
        # (e.g. the endonend platform backend from KB/0002-architecture.md).
        module: [cli, protocol]
    defaults:
      run:
        working-directory: ${{ matrix.module }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: ${{ matrix.module }}/go.mod

      - name: Build
        run: go build ./...

      - name: Vet
        run: go vet ./...

      - name: Test
        run: go test ./...

      - name: Lint
        uses: golangci/golangci-lint-action@v7
        with:
          working-directory: ${{ matrix.module }}
          # Pinned rather than "latest": golangci-lint-action v6 only
          # understands golangci-lint v1, and v6's "latest" resolved to a v1
          # build older than the Go version in go.mod, which golangci-lint
          # refuses to run against. v7 supports golangci-lint v2; pin
          # deliberately rather than tracking "latest" again.
          version: v2.13.2
